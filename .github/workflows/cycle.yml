name: Zoom prediction cycle

# Four triggers per hour (roughly every 15 min), at :02/:17/:32/:47 -- NOT
# on the hour. GitHub's own docs warn that "the start of every hour" (:00)
# is the single most congested slot for scheduled workflows across all of
# GitHub, and under load some scheduled runs are dropped entirely rather
# than just delayed -- confirmed in practice twice now: first two
# consecutive runs landed 3h17m apart instead of ~1h with the old single
# "0 * * * *" schedule (fixed by going to two off-peak triggers); then,
# even with two triggers, FOUR consecutive slots in a row (~10:17-11:47)
# got silently dropped with no failed-run record at all -- worse than
# ordinary congestion, but going from 2 to 4 triggers/hour at least means a
# dropped streak needs twice as many consecutive misses before it costs a
# full round's fixture preview (see scraper/fixtures_scraper.py's docstring
# -- unlike results, a missed fixture-preview window can't be backfilled
# later, since the fixtures page only ever shows the single current
# upcoming round with no archive).
#
# NOTE: GitHub's scheduled triggers remain best-effort even off-peak and can
# still slip by minutes to (rarely) tens of minutes under load -- not a hard
# real-time guarantee. That's fine at this cadence normally, since a season
# takes ~2.5 days to complete -- but a multi-hour scheduler outage (as
# opposed to routine minutes-level drift) can still cost a round's worth of
# predictions outright, which no in-workflow retry logic can fix once the
# scheduler itself never starts the job. `workflow_dispatch` below lets you
# trigger a catch-up run by hand anytime you notice a gap.
#
# SELF-CHAINING (added 2026-10-10): measured over Sep 7 - Oct 10, GitHub
# only started ~16-26 of the 96 scheduled runs per day, with near-daily
# 5-7 hour gaps of no runs at all. So the cycle no longer relies on the
# schedule: each run's last step dispatches the NEXT run itself (see
# "Trigger next cycle" below), no sooner than MIN_INTERVAL_MIN after this
# run started. workflow_dispatch is the documented exception to "events
# from GITHUB_TOKEN don't trigger new runs", so this needs no personal
# token. The schedule above stays as a backstop that restarts the chain
# if it ever breaks; the concurrency group keeps it to one run at a time,
# so the chain can't multiply.
#
# To stop the chain: set repo variable CYCLE_CHAIN=off (Settings ->
# Secrets and variables -> Actions -> Variables), or disable the workflow.
on:
  schedule:
    - cron: "2 * * * *"
    - cron: "17 * * * *"
    - cron: "32 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # lets the last step dispatch the next run

concurrency:
  group: zoom-cycle
  cancel-in-progress: false

jobs:
  cycle:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from
    # 2026-10-19 -- a new image can ship a different Chrome/driver setup and
    # break the Selenium scraper without warning. Bump deliberately, and
    # watch the first run after doing so.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIN_INTERVAL_MIN: 15
    steps:
      - name: Record start time
        run: echo "CYCLE_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full cycle (scrape -> features -> predict -> track -> dashboard)
        env:
          GH_TOKEN: ${{ github.token }}   # dashboard/health.py reads recent run outcomes
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ===" | tee -a cycle.log
            # cycle.log feeds the failure alert below.
            if python run.py cycle 2>&1 | tee -a cycle.log; then
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 30s..."
              sleep 30
            fi
          done
          echo "::error::python run.py cycle failed 3 times -- see the log above for the traceback."
          exit 1

      - name: Commit and push updated DB + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the gzipped DB + archives are tracked -- GitHub rejects any
          # file over 100 MiB, which the raw zoom.db hit in Sept 2026 and
          # silently failed every push for weeks. run.py cycle packs them.
          git add data/zoom.db.gz data/archive docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Size guard: GitHub rejects any file over 100 MiB, and when the
          # old raw zoom.db crossed that the push failed with nothing but a
          # generic "job failed" email for ~4 weeks. Fail loudly and early
          # with the actual reason instead, and warn well before the limit.
          for f in $(git diff --cached --name-only); do
            [ -f "$f" ] || continue
            size=$(stat -c %s "$f")
            mb=$((size / 1048576))
            if [ "$size" -ge $((90 * 1048576)) ]; then
              echo "::error file=$f::$f is ${mb} MiB -- GitHub rejects files over 100 MiB. Archive/split it (see db/archive.py) before this can push."
              exit 1
            elif [ "$size" -ge $((70 * 1048576)) ]; then
              echo "::warning file=$f::$f is ${mb} MiB, approaching GitHub's 100 MiB per-file limit."
            fi
          done

          git commit -m "Automated cycle: $(date -u +'%Y-%m-%d %H:%M UTC')"

          # The remote can move between this job's checkout and this push --
          # e.g. someone pushing a manual code fix while this run's scrape/
          # predict/track steps were still in flight. A bare `git push` would
          # just fail and drop this run's update. Retry a couple times with
          # a rebase first: data/zoom.db.gz and docs/index.html are both fully
          # regenerated artifacts (not hand-authored diffs), so replaying
          # this commit on top of whatever landed is always safe UNLESS the
          # remote commit touched the *same* generated files (a real content
          # collision, e.g. another cycle run or a manual DB backfill) -- in
          # that case rebase can't auto-merge a binary gzip file and we
          # give up gracefully. That's fine: this pipeline reflects current
          # state, not history, so the next scheduled run 30ish minutes
          # later just picks up from whatever's on the remote and continues.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (remote moved), attempt $attempt/3..."
            if [ "$attempt" -lt 3 ]; then
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::warning::Rebase hit a real conflict (likely both sides touched data/zoom.db.gz) -- giving up, next scheduled run will continue from the remote's current state."
                git rebase --abort
                exit 1
              fi
            fi
          done
          echo "::error::All 3 push attempts failed -- this run's data was NOT saved."
          exit 1

      - name: Alert on Telegram if this run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          tail_log=$(tail -n 25 cycle.log 2>/dev/null || echo "(no cycle log -- failed before or after the cycle step, e.g. the push)")
          text=$(printf '⚠️ Zoom cycle FAILED\n%s\n\nLast log lines:\n%s' "$RUN_URL" "$tail_log" | head -c 3800)
          python3 -c 'import json,sys; print(json.dumps({"chat_id": sys.argv[1], "text": sys.argv[2], "disable_web_page_preview": True}))' \
            "$TELEGRAM_CHAT_ID" "$text" > /tmp/tg.json
          curl -s -o /dev/null -w "Telegram HTTP %{http_code}\n" -X POST -H "Content-Type: application/json" \
            --data @/tmp/tg.json "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true

      - name: Trigger next cycle
        # always(): a failed cycle must not break the chain -- the next
        # run may well succeed (site hiccup, push race, etc.).
        if: always() && vars.CYCLE_CHAIN != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pace the chain: wait until MIN_INTERVAL_MIN after this run started.
          wait=$(( CYCLE_STARTED_AT + MIN_INTERVAL_MIN * 60 - $(date -u +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "Waiting ${wait}s before triggering the next cycle..."
            sleep "$wait"
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/dispatch.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cycle.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$code" = "204" ]; then
              echo "Next cycle dispatched."
              exit 0
            fi
            echo "Dispatch attempt $attempt got HTTP $code: $(cat /tmp/dispatch.out)"
            sleep 10
          done
          echo "::error::Could not dispatch the next cycle -- chain broken until the next scheduled run restarts it."
          exit 1
